name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger only when a tag like v1.0.0 is pushed

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt6 PyQt6-WebEngine requests

    - name: Build Executable
      run: |
        pyinstaller owl.spec
        
    - name: Generate latest.json
      run: |
        $TAG_NAME = $env:GITHUB_REF_NAME
        $URL = "https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/Owl.exe"
        $JSON_CONTENT = "{ `"version`": `"$TAG_NAME`", `"url`": `"$URL`" }"
        Set-Content -Path latest.json -Value $JSON_CONTENT
        
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/Owl.exe
          latest.json
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
